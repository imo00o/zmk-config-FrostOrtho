# キーマップの画像（SVG）を keymap-drawer でレイヤーごとに生成して keymap-drawer/ にコミットする
# https://github.com/caksoylar/keymap-drawer
name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/*.keymap'
      - 'config/*.json'
      - 'keymap_drawer.config.yaml'
      - '.github/workflows/draw-keymaps.yml'

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 生成した画像をリポジトリにコミットするため
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: keymap-drawer をインストール
        run: pip install keymap-drawer==0.23.0
      - name: レイヤーごとに SVG を生成
        run: |
          keymap -c keymap_drawer.config.yaml parse -z config/FrostOrtho.keymap -o keymap-drawer/FrostOrtho.yaml
          # レイヤーを増やしたときはここにも追加する
          for layer in default 1 2 3 4 5 6 7; do
            output="$layer"
            if [ "$layer" = "default" ]; then output=0; fi
            keymap -c keymap_drawer.config.yaml draw keymap-drawer/FrostOrtho.yaml -j config/FrostOrtho.json -s "$layer" -o "keymap-drawer/layer$output.svg"
          done
      - name: 変更があればコミット
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add keymap-drawer
          if ! git diff --cached --quiet; then
            git commit -m 'キーマップ画像を更新'
            git push
          fi
